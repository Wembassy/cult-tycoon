<!DOCTYPE html>
<html>
<head>
<title>Model Diagnostics</title>
<style>
body { margin: 0; background: #1a1a2e; color: #eee; font-family: monospace; }
#info { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px; max-width: 400px; font-size: 12px; }
canvas { display: block; }
</style>
</head>
<body>
<div id="info">
  <div id="stats"></div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(3, 3, 3);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dir = new THREE.DirectionalLight(0xffffff, 1.0);
dir.position.set(5, 10, 5);
dir.castShadow = true;
scene.add(dir);

// Grid + ground
scene.add(new THREE.GridHelper(4, 4, 0x444444, 0x222222));

const models = [
  '/assets/models/followers/fantasy_wizard_01.glb',
  '/assets/models/followers/fantasy_sorcerer_01.glb',
  '/assets/models/followers/fantasy_witch_01.glb',
  '/assets/models/followers/fantasy_druid_01.glb',
  '/assets/models/followers/adventure_viking_01.glb',
];

const stats = document.getElementById('stats');
let currentIdx = 0;
let currentModel = null;

function loadModel(idx) {
  if (currentModel) {
    scene.remove(currentModel);
    currentModel.traverse(o => {
      if (o.isMesh) { o.geometry?.dispose(); o.material?.dispose(); }
    });
  }
  
  const url = models[idx];
  stats.innerHTML = `Loading: ${url.split('/').pop()}...`;
  
  new GLTFLoader().load(url, (gltf) => {
    currentModel = gltf.scene;
    
    // Compute bounding box
    const box = new THREE.Box3().setFromObject(currentModel);
    const size = new THREE.Vector3();
    box.getSize(size);
    const center = new THREE.Vector3();
    box.getCenter(center);
    
    stats.innerHTML = `
      <b>${url.split('/').pop()}</b><br>
      Model ${idx+1}/${models.length} — click to cycle<br>
      Bounding box:<br>
      &nbsp; size: ${size.x.toFixed(3)} x ${size.y.toFixed(3)} x ${size.z.toFixed(3)}<br>
      &nbsp; min: (${box.min.x.toFixed(3)}, ${box.min.y.toFixed(3)}, ${box.min.z.toFixed(3)})<br>
      &nbsp; max: (${box.max.x.toFixed(3)}, ${box.max.y.toFixed(3)}, ${box.max.z.toFixed(3)})<br>
      &nbsp; center: (${center.x.toFixed(3)}, ${center.y.toFixed(3)}, ${center.z.toFixed(3)})<br>
      Animations: ${gltf.animations.length}<br>
      ${gltf.animations.map(a => a.name).join(', ')}<br><br>
      With scale=1.5: height=${(size.y*1.5).toFixed(3)}, min_y=${(box.min.y*1.5).toFixed(3)}
    `;
    console.log('Bounding box:', box);
    console.log('Size:', size);
    console.log('Center:', center);
    
    scene.add(currentModel);
  }, undefined, (err) => {
    stats.innerHTML = `Error: ${err.message}`;
  });
}

loadModel(0);

document.addEventListener('click', () => {
  currentIdx = (currentIdx + 1) % models.length;
  loadModel(currentIdx);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
