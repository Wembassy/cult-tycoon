name: Publish Alpha 7 Release

on:
  push:
    branches: [alpha/vertical-slice]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Alpha 7 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37150604399 \
            --repo Wembassy/cult-tycoon \
            --name cult-tycoon-alpha7-windows
          find . -maxdepth 4 -type f -print

      - name: Verify release files
        run: |
          test -s cult-tycoon-alpha7-windows.zip
          test -n "$(find release/nsis -maxdepth 1 -type f -name '*.exe' -print -quit)"
          test -n "$(find release/portable -maxdepth 1 -type f -name '*.exe' -print -quit)"

      - name: Publish Alpha 7 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PORTABLE="$(find release/portable -maxdepth 1 -type f -name '*.exe' -print -quit)"
          INSTALLER="$(find release/nsis -maxdepth 1 -type f -name '*.exe' -print -quit)"
          gh release create v0.1.0-alpha.7 \
            cult-tycoon-alpha7-windows.zip \
            "$PORTABLE" \
            "$INSTALLER" \
            --repo Wembassy/cult-tycoon \
            --target 4180c7e008fd1a83c86d78c93c30696a15f1f657 \
            --title "Cult Tycoon v0.1.0 Alpha 7" \
            --prerelease \
            --notes "Alpha 7 focuses on pawn scale/interaction, animation, and a real finite-resource colony loop.

          Pawn/world scale:
          - tile meshes are about 10% smaller (0.9 vs 1.0)
          - follower models are about 25% larger
          - followers sharing the same logical tile get render-only radial separation so they remain visually distinct

          Pawn interaction:
          - visible pawn selection uses screen-space hit testing rather than tile-only lookup
          - selected pawns get a selection ring
          - RimWorld-style inspector now exposes needs, health, role, quality tier, AI state, shift, current job, traits, skills, work priorities, and inventory

          Animation:
          - shared authored follower animation library with semantic Idle / Walk / Work / Pray / Eat / Sleep clips
          - shared library is generated from the canonical follower skeleton
          - every follower GLB variant was audited for compatibility with animation target joints
          - no idle vertical bob fallback
          - Harvest jobs use Work animation

          Time controls:
          - Pause / 1x / 2x / 3x use a persistent HUD click listener and callback wiring
          - keyboard controls remain Space / 1 / 2 / 3

          Resource economy:
          - new Harvest build category
          - trees -> Materials
          - rocks -> Materials
          - bushes -> Food
          - click or drag to designate finite map resources for harvesting
          - persistent harvest designation markers
          - pawns receive Harvest jobs, move/work, resource disappears, stock increases
          - Build and Haul no longer create free Materials
          - construction requires and reserves both money and Materials
          - wall: 3 Materials, floor: 1, door: 4; objects scale from their cost
          - HUD shows available Materials and Food
          - harvested terrain, pending harvest orders, Materials/Food, and construction reservations persist through save/load
          - New Game clears pending construction/harvest orders

          Validation:
          - explicit alpha/vertical-slice branch + exact commit guard passed
          - 436/436 unit tests passed
          - ESLint passed
          - TypeScript/Vite production build passed
          - shared animation library audit passed against every follower rig
          - Alpha 7 gameplay source-invariant gate passed
          - NSIS installer passed
          - portable EXE passed
          - packaged app.asar marker verification passed for animation library, Harvest, Materials/Food, time controls, construction blueprints, and Alpha 7 identity

          Use the portable EXE first for playtesting."
