name: Publish Alpha Release

on:
  push:
    branches: [alpha/vertical-slice]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Windows Alpha artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/Wembassy/cult-tycoon/actions/artifacts/11259108801/zip"             -o cult-tycoon-alpha-windows.zip

      - name: Verify ZIP
        run: |
          test -s cult-tycoon-alpha-windows.zip
          unzip -l cult-tycoon-alpha-windows.zip | head -100

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.0-alpha.1"
          TITLE="Cult Tycoon v0.1.0 Alpha 1"

          if gh release view "$TAG" --repo Wembassy/cult-tycoon >/dev/null 2>&1; then
            gh release upload "$TAG" cult-tycoon-alpha-windows.zip --repo Wembassy/cult-tycoon --clobber
          else
            gh release create "$TAG" cult-tycoon-alpha-windows.zip               --repo Wembassy/cult-tycoon               --target alpha/vertical-slice               --title "$TITLE"               --prerelease               --notes "First Windows Alpha candidate. This release contains the compiled Windows installer and unpacked executable. Validation: ESLint passes, 424/424 unit tests pass, TypeScript/Vite production build passes, and Windows Electron/NSIS packaging passed."
          fi
