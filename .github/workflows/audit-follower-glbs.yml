name: Audit Follower GLBs

on:
  push:
    branches: [alpha/vertical-slice]
    paths:
      - 'public/assets/models/followers/**'
      - 'public/assets/animations/followers/**'
      - 'src/data/FollowerAnimations.ts'
      - 'src/engine/AssetLoader.ts'
      - 'src/engine/SceneManager.ts'
      - '.github/workflows/audit-follower-glbs.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect follower GLB rigs and animations
        shell: python
        run: |
          import json, struct, glob, os

          def parse_glb(path):
              with open(path, "rb") as f:
                  data = f.read()
              magic, version, length = struct.unpack_from("<III", data, 0)
              if magic != 0x46546C67:
                  raise ValueError("not glTF binary")
              off = 12
              doc = None
              while off < len(data):
                  chunk_len, chunk_type = struct.unpack_from("<II", data, off)
                  off += 8
                  chunk = data[off:off+chunk_len]
                  off += chunk_len
                  if chunk_type == 0x4E4F534A:
                      doc = json.loads(chunk.decode("utf-8").rstrip("\x00 \t\r\n"))
                      break
              return doc or {}

          print("FOLLOWER_GLTF_AUDIT_BEGIN")
          for path in sorted(glob.glob("public/assets/models/followers/*.glb")):
              doc = parse_glb(path)
              nodes = doc.get("nodes", [])
              skins = doc.get("skins", [])
              anims = doc.get("animations", [])
              meshes = doc.get("meshes", [])

              joint_sets = [set(s.get("joints", [])) for s in skins]
              all_joints = set().union(*joint_sets) if joint_sets else set()
              skinned_nodes = [i for i,n in enumerate(nodes) if "skin" in n]

              print(f"MODEL {os.path.basename(path)}")
              print(f"  nodes={len(nodes)} meshes={len(meshes)} skins={len(skins)} skinned_nodes={len(skinned_nodes)}")
              if skins:
                  print("  joints=" + ",".join(str(len(s.get("joints", []))) for s in skins))
                  print("  skeleton_roots=" + ",".join(str(s.get("skeleton", "none")) for s in skins))
                  if os.path.basename(path) == "fantasy_wizard_01.glb":
                      joint_names = []
                      for skin in skins:
                          for joint_index in skin.get("joints", []):
                              if joint_index < len(nodes):
                                  joint_names.append(nodes[joint_index].get("name", f"node_{joint_index}"))
                      print("  joint_names=" + "|".join(joint_names))
              else:
                  print("  joints=0")
              print(f"  animations={len(anims)}")

              accessors = doc.get("accessors", [])
              for idx, anim in enumerate(anims):
                  name = anim.get("name") or f"animation_{idx}"
                  channels = anim.get("channels", [])
                  samplers = anim.get("samplers", [])
                  target_nodes = []
                  paths = []
                  invalid = 0
                  joint_targets = 0
                  max_time = 0.0
                  for sampler in samplers:
                      input_idx = sampler.get("input")
                      if isinstance(input_idx, int) and input_idx < len(accessors):
                          acc = accessors[input_idx]
                          if "max" in acc and acc["max"]:
                              max_time = max(max_time, float(acc["max"][0]))
                  for ch in channels:
                      target = ch.get("target", {})
                      node = target.get("node")
                      p = target.get("path", "?")
                      paths.append(p)
                      if node is not None:
                          target_nodes.append(node)
                          if node >= len(nodes):
                              invalid += 1
                          if node in all_joints:
                              joint_targets += 1
                  print(f"    clip_index={idx} clip={name!r} duration={max_time:.3f}s channels={len(channels)} joint_targets={joint_targets} invalid_targets={invalid} paths={sorted(set(paths))}")

              has_skin = len(skins) > 0 and any(len(s.get("joints", [])) > 0 for s in skins)
              has_anim = len(anims) > 0
              print(f"  RESULT rigged={has_skin} animated={has_anim}")
          # Validate the optional shared animation library against the active follower rig.
          manifest_path = "public/assets/animations/followers/manifest.json"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  manifest = json.load(f)

              if manifest.get("enabled"):
                  source = manifest.get("source", "")
                  prefix = "./assets/"
                  if source.startswith(prefix):
                      source_path = "public/assets/" + source[len(prefix):]
                  else:
                      source_path = source

                  if not os.path.exists(source_path):
                      raise SystemExit(f"Animation manifest enabled but source is missing: {source_path}")

                  # Use the wizard as the canonical active follower rig.
                  reference = parse_glb("public/assets/models/followers/fantasy_wizard_01.glb")
                  ref_nodes = reference.get("nodes", [])
                  ref_skins = reference.get("skins", [])
                  ref_joint_indices = set()
                  for skin in ref_skins:
                      ref_joint_indices.update(skin.get("joints", []))
                  ref_joint_names = {
                      ref_nodes[i].get("name")
                      for i in ref_joint_indices
                      if i < len(ref_nodes) and ref_nodes[i].get("name")
                  }

                  lib = parse_glb(source_path)
                  lib_nodes = lib.get("nodes", [])
                  lib_anims = lib.get("animations", [])

                  keywords = {
                      "idle": ["idle", "stand", "standing", "rest", "breath"],
                      "walk": ["walk", "locomotion", "move"],
                      "work": ["work", "hammer", "build", "clean", "research", "cook", "craft"],
                      "pray": ["pray", "prayer", "worship", "ritual", "kneel"],
                      "eat": ["eat", "eating", "drink", "drinking"],
                      "sleep": ["sleep", "sleeping", "lie", "lying"],
                  }

                  names = [(a.get("name") or "").lower() for a in lib_anims]
                  missing_states = [
                      state
                      for state, words in keywords.items()
                      if not any(any(word in name for word in words) for name in names)
                  ]
                  if missing_states:
                      raise SystemExit(
                          "Shared follower animation library is missing semantic states: "
                          + ", ".join(missing_states)
                      )

                  invalid_track_nodes = []
                  for anim in lib_anims:
                      for channel in anim.get("channels", []):
                          node_idx = channel.get("target", {}).get("node")
                          if node_idx is None or node_idx >= len(lib_nodes):
                              continue
                          node_name = lib_nodes[node_idx].get("name")
                          if node_name and node_name not in ref_joint_names:
                              invalid_track_nodes.append(node_name)

                  if invalid_track_nodes:
                      unique = sorted(set(invalid_track_nodes))
                      raise SystemExit(
                          "Shared animation tracks target nodes outside the canonical follower rig: "
                          + ", ".join(unique[:20])
                      )

                  print(
                      f"SHARED_LIBRARY_OK clips={len(lib_anims)} "
                      f"states={','.join(keywords.keys())} source={source_path}"
                  )

          print("FOLLOWER_GLTF_AUDIT_END")
