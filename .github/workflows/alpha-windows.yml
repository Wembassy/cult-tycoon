name: Alpha Windows Build

on:
  push:
    branches: [alpha/vertical-slice]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha/vertical-slice
          fetch-depth: 0
          clean: true

      - name: Prove source branch and commit
        shell: pwsh
        run: |
          Write-Host "Branch:"
          git branch --show-current
          Write-Host "Commit:"
          git rev-parse HEAD
          Write-Host "Recent commits:"
          git log -5 --oneline
          if ((git branch --show-current) -ne "alpha/vertical-slice") {
            throw "Wrong branch checked out."
          }

      - name: Clean generated output
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force release -ErrorAction SilentlyContinue
          Remove-Item -Force cult-tycoon-alpha8-windows.zip -ErrorAction SilentlyContinue

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run lint
          npm run test
          npm run build

      - name: Verify Alpha 8 gameplay source invariants
        shell: pwsh
        run: |
          $scene = Get-Content "src/engine/SceneManager.ts" -Raw
          $main = Get-Content "src/main.ts" -Raw
          $hud = Get-Content "src/ui/HUDManager.ts" -Raw
          $spatial = Get-Content "src/world/Spatial.ts" -Raw
          $navigation = Get-Content "src/world/NavigationGrid.ts" -Raw
          $global = Get-Content "src/world/GlobalWorld.ts" -Raw
          $farming = Get-Content "src/systems/FarmingSystem.ts" -Raw
          $outsiders = Get-Content "src/systems/OutsiderSystem.ts" -Raw
          $ideology = Get-Content "src/systems/IdeologySystem.ts" -Raw
          if (-not $spatial.Contains("constructionSubdivisions: 10")) { throw "Fine Construction Space is missing." }
          if (-not $navigation.Contains("isWalkable")) { throw "Dedicated Navigation Space is missing." }
          if (-not $scene.Contains("setSelectedFollower")) { throw "Follower selection rendering is missing." }
          if (-not $scene.Contains("setFarmingVisuals")) { throw "Grow-zone rendering is missing." }
          if (-not $scene.Contains("'idle', 'walk', 'work', 'pray', 'eat', 'sleep'")) { throw "Semantic follower animation states are missing." }
          if (-not $main.Contains("onTimeModeChange")) { throw "Clickable time-control callback wiring is missing." }
          if (-not $main.Contains("zone:grow:fast_root")) { throw "Grow-zone tools are missing." }
          if (-not $main.Contains("openIdeologyDialog")) { throw "Ideology management is missing." }
          if (-not $main.Contains("showOutsiderDialog")) { throw "Outsider recruitment UI is missing." }
          if (-not $global.Contains("outsiderTraffic")) { throw "Global-world traffic data is missing." }
          if (-not $farming.Contains("hearty_grain")) { throw "Alpha crop lifecycle is missing." }
          if (-not $outsiders.Contains("attemptRecruitment")) { throw "Recruitment system is missing." }
          if (-not $ideology.Contains("recordFoodEvent")) { throw "Doctrine-driven behavior is missing." }
          if (-not $hud.Contains("ALPHA 8")) { throw "Alpha 8 HUD identity is missing." }
          if (-not $hud.Contains("Materials")) { throw "Materials HUD stat is missing." }
          if (-not $hud.Contains("Food")) { throw "Food HUD stat is missing." }

      - name: Package Windows Alpha 8 installer
        run: npx electron-builder --win nsis --publish never --config.directories.output=release/nsis

      - name: Package Windows Alpha 8 portable
        run: npx electron-builder --win portable --publish never --config.directories.output=release/portable

      - name: Verify packaged Alpha 8 UI and identity
        shell: pwsh
        run: |
          $asar = "release/nsis/win-unpacked/resources/app.asar"
          if (-not (Test-Path $asar)) { throw "Missing packaged app.asar" }
          node -e "const fs=require('fs');const s=fs.readFileSync('release/nsis/win-unpacked/resources/app.asar').toString('utf8');for(const needle of ['ALPHA 8','follower_animation_library.glb','harvest-designations','harvest:tree','zone:grow:fast_root','communal_devotion','outsiderTraffic','Materials','Food','speed3','hud-build-status','construction-blueprints']){if(!s.includes(needle)){console.error('Missing packaged marker:',needle);process.exit(1)}}console.log('Packaged Alpha 8 gameplay markers verified.')"

      - name: Create release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "release/nsis/*","release/portable/*" -DestinationPath "cult-tycoon-alpha8-windows.zip" -CompressionLevel Optimal

      - name: Upload Alpha 8 artifact
        uses: actions/upload-artifact@v4
        with:
          name: cult-tycoon-alpha8-windows
          path: |
            cult-tycoon-alpha8-windows.zip
            release/portable/*.exe
            release/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
