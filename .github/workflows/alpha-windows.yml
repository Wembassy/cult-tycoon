name: Alpha Windows Build

on:
  push:
    branches: [alpha/vertical-slice]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run lint
          npm run test
          npm run build

      - name: Package Windows Alpha
        run: npx electron-builder --win --publish never

      - name: Create release ZIP
        shell: pwsh
        run: |
          if (Test-Path "cult-tycoon-alpha-windows.zip") {
            Remove-Item "cult-tycoon-alpha-windows.zip" -Force
          }
          Compress-Archive -Path "release/*" -DestinationPath "cult-tycoon-alpha-windows.zip" -CompressionLevel Optimal

      - name: Upload Alpha installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: cult-tycoon-alpha-windows
          path: cult-tycoon-alpha-windows.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.1.0-alpha.2"
          $title = "Cult Tycoon v0.1.0 Alpha 2"
          $notes = @"
          Second Windows Alpha candidate. Fixes startup visibility and fog-of-war readability.

          Validation:
          - ESLint passes
          - 424/424 unit tests pass
          - TypeScript/Vite production build passes
          - Windows Electron/NSIS packaging passes

          Download the attached cult-tycoon-alpha-windows.zip and run Cult Tycoon Setup 0.1.0.exe. Alpha 2 reveals a large starter clearing and keeps unexplored terrain as a dark silhouette instead of a black void.
          "@

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "cult-tycoon-alpha-windows.zip" --clobber
          } else {
            gh release create $tag "cult-tycoon-alpha-windows.zip" --target "$env:GITHUB_SHA" --title $title --notes $notes --prerelease
          }
