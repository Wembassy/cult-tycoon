name: Alpha Windows Build

on:
  push:
    branches: [alpha/vertical-slice]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha/vertical-slice
          fetch-depth: 0
          clean: true

      - name: Prove source branch and commit
        shell: pwsh
        run: |
          Write-Host "Branch:"
          git branch --show-current
          Write-Host "Commit:"
          git rev-parse HEAD
          Write-Host "Recent commits:"
          git log -5 --oneline
          if ((git branch --show-current) -ne "alpha/vertical-slice") {
            throw "Wrong branch checked out."
          }

      - name: Clean generated output
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force release -ErrorAction SilentlyContinue
          Remove-Item -Force cult-tycoon-alpha7-windows.zip -ErrorAction SilentlyContinue

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run lint
          npm run test
          npm run build

      - name: Verify Alpha 7 gameplay source invariants
        shell: pwsh
        run: |
          $scene = Get-Content "src/engine/SceneManager.ts" -Raw
          $main = Get-Content "src/main.ts" -Raw
          $hud = Get-Content "src/ui/HUDManager.ts" -Raw
          if (-not $scene.Contains("const TILE_SIZE = 0.9")) { throw "Expected 10% smaller tile mesh size is missing." }
          if (-not $scene.Contains("const modelScale = 0.075")) { throw "Expected +25% follower scale is missing." }
          if (-not $scene.Contains("setSelectedFollower")) { throw "Follower selection rendering is missing." }
          if (-not $scene.Contains("followerDisplayOffsets")) { throw "Crowded-tile follower separation is missing." }
          if (-not $scene.Contains("job?.type === 'harvest'")) { throw "Harvest work animation mapping is missing." }
          if (-not $main.Contains("onTimeModeChange")) { throw "Clickable time-control callback wiring is missing." }
          if (-not $main.Contains("designateHarvestArea")) { throw "Harvest designation workflow is missing." }
          if (-not $main.Contains("getAvailableMaterials")) { throw "Material-gated construction is missing." }
          if (-not $hud.Contains("Materials")) { throw "Materials HUD stat is missing." }
          if (-not $hud.Contains("Food")) { throw "Food HUD stat is missing." }

      - name: Package Windows Alpha 7 installer
        run: npx electron-builder --win nsis --publish never --config.directories.output=release/nsis

      - name: Package Windows Alpha 7 portable
        run: npx electron-builder --win portable --publish never --config.directories.output=release/portable

      - name: Verify packaged Alpha 7 UI and identity
        shell: pwsh
        run: |
          $asar = "release/nsis/win-unpacked/resources/app.asar"
          if (-not (Test-Path $asar)) { throw "Missing packaged app.asar" }
          node -e "const fs=require('fs');const s=fs.readFileSync('release/nsis/win-unpacked/resources/app.asar').toString('utf8');for(const needle of ['ALPHA 7','Cult Tycoon - Alpha 7','follower_animation_library.glb','harvest-designations','harvest:tree','Materials','Food','speed3','hud-build-status','construction-blueprints']){if(!s.includes(needle)){console.error('Missing packaged marker:',needle);process.exit(1)}}console.log('Packaged Alpha 7 UI markers verified.')"

      - name: Create release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "release/nsis/*","release/portable/*" -DestinationPath "cult-tycoon-alpha7-windows.zip" -CompressionLevel Optimal

      - name: Upload Alpha 7 artifact
        uses: actions/upload-artifact@v4
        with:
          name: cult-tycoon-alpha7-windows
          path: |
            cult-tycoon-alpha7-windows.zip
            release/portable/*.exe
            release/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
