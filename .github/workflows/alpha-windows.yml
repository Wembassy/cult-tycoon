name: Alpha Windows Build

on:
  push:
    branches: [alpha/vertical-slice]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run lint
          npm run test
          npm run build

      - name: Package Windows Alpha
        run: npx electron-builder --win --publish never

      - name: Verify packaged Alpha 4 UI
        shell: pwsh
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('release/win-unpacked/resources/app.asar').toString('utf8');for(const needle of ['ALPHA 4','hud-menu-toggle','hud-minimap','Designate a Dormitory']){if(!s.includes(needle)){console.error('Missing packaged marker:',needle);process.exit(1)}}console.log('Packaged Alpha 4 UI markers verified.')"

      - name: Create release ZIP
        shell: pwsh
        run: |
          if (Test-Path "cult-tycoon-alpha-windows.zip") {
            Remove-Item "cult-tycoon-alpha-windows.zip" -Force
          }
          Compress-Archive -Path "release/*" -DestinationPath "cult-tycoon-alpha-windows.zip" -CompressionLevel Optimal

      - name: Upload Alpha installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: cult-tycoon-alpha-windows
          path: cult-tycoon-alpha-windows.zip
          if-no-files-found: error
          retention-days: 14
