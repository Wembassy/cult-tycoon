name: Publish Alpha 2

on:
  push:
    branches: [alpha/vertical-slice]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download visibility-fixed Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/Wembassy/cult-tycoon/actions/artifacts/11260184254/zip"             -o cult-tycoon-alpha-windows.zip

      - name: Publish Alpha 2 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.0-alpha.2" cult-tycoon-alpha-windows.zip             --repo Wembassy/cult-tycoon             --target 9dbf871e9d1f3506324f0a826822a8468d807acc             --title "Cult Tycoon v0.1.0 Alpha 2"             --prerelease             --notes "Alpha 2 fixes the black startup scene reported in Alpha 1. The starter compound now has a 15-tile revealed clearing centered on the actual follower spawn point, unexplored terrain remains visible as a dark silhouette instead of disappearing into a black void, and fog visibility refreshes responsively. Validation: ESLint passes, 424/424 unit tests pass, TypeScript/Vite production build passes, and Windows Electron/NSIS packaging passes."
