name: Runtime validation
on:
  push:
    branches: [quality/runtime-stabilization]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test && npm run build
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Exercise real browser runtime
        run: node scripts/runtime-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-results
          path: runtime-results/
          if-no-files-found: error
          retention-days: 14
